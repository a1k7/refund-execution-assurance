[project]
name = "refund-execution-assurance"
version = "0.1.0"
description = "Execution-boundary assurance and verification harness for AI-initiated financial refunds (DecisionAssure + simulated Parmana)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.0",
    "cryptography>=43.0.0",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"